<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wine Collection & Management</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #faf8f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid #eae5de;
      margin-bottom: 30px;
    }

    h1, h2 {
      text-align: center;
      color: #aa152c;
      margin-bottom: 25px;
    }

    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; margin-top: 0; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #dcd6cd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      outline: none;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      border-color: #aa152c;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      grid-column: span 2;
    }

    .btn-submit {
      flex: 1;
      background: #aa152c;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #8b1022;
    }

    .btn-cancel {
      display: none;
      background: #888;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background: #666;
    }

    /* Table Styles for Management Section */
    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    th {
      background-color: #f7f5f0;
      color: #aa152c;
      font-weight: 600;
    }

    .wine-thumb {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      margin-right: 4px;
    }

    .btn-edit-item {
      background-color: #f0a500;
      color: white;
    }

    .btn-edit-item:hover {
      background-color: #d99100;
    }

    .btn-delete-item {
      background-color: #dc3545;
      color: white;
    }

    .btn-delete-item:hover {
      background-color: #bd2130;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: #aa152c;
    }
  </style>
</head>

<body>

  <!-- ส่วนที่ 1: ฟอร์ม เพิ่ม / แก้ไข ไวน์ -->
  <div class="container">
    <h1 id="formTitle">🍷 Wine Collection</h1>
    <form id="addWineForm" onsubmit="submitWine(event)">
      <div class="form-group full">
        <input type="text" id="winery" placeholder="Winery / Producer (e.g. Andrew Januik, B Cellars)" required>
      </div>
      <div class="form-group full">
        <input type="text" id="name" placeholder="Wine Name (e.g. Stone Cairn Cabernet Sauvignon 2013)" required>
      </div>
      <div class="form-group">
        <select id="type" required>
          <option value="" disabled selected>Select Type</option>
          <option value="Red">Red</option>
          <option value="White">White</option>
          <option value="Sparkling">Sparkling</option>
          <option value="Rosé">Rosé</option>
          <option value="Dessert">Dessert</option>
          <option value="Fortified">Fortified</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="region" placeholder="Region / Country (e.g. Bordeaux, France)">
      </div>
      <div class="form-group">
        <input type="number" id="price" placeholder="Price (THB)" required>
      </div>
      <div class="form-group">
        <input type="number" step="0.1" id="rating" placeholder="Rating (1.0 - 5.0)" min="1" max="5">
      </div>
      <div class="form-group full">
        <input type="text" id="image" placeholder="Image URL (e.g. https://...)">
      </div>
      
      <div class="btn-group">
        <button type="submit" class="btn-submit" id="submitBtn">Add Wine to Cellar</button>
        <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- ส่วนที่ 2: ตารางจัดการไวน์ด้านล่าง (Read / Edit / Delete) -->
  <div class="container">
    <h2>📋 Manage Current Wine Inventory</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Name & Winery</th>
            <th>Type</th>
            <th>Price</th>
            <th>Rating</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="wineTableBody">
          <tr>
            <td colspan="6" style="text-align:center;">Loading wines...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <a href="wines.html" class="back-link">← Back to Wines Catalog</a>

  <script>
    let currentEditingId = null;
    let allWinesData = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadWines();

      // เช็ก URL parameter ว่ามี id หรือไม่ (กรณีคลิกแก้ไขมาจากหน้าอื่น)
      const urlParams = new URLSearchParams(window.location.search);
      const wineId = urlParams.get('id');
      if (wineId) {
        currentEditingId = wineId;
      }
    });

    // 1. ดึงข้อมูลไวน์ทั้งหมดมาแสดงในตาราง (Read)
    async function loadWines() {
      try {
        const res = await fetch('/api/wines');
        allWinesData = await res.json();

        const tbody = document.getElementById('wineTableBody');
        tbody.innerHTML = '';

        if (allWinesData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No wines found in cellar.</td></tr>';
          return;
        }

        allWinesData.forEach(wine => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${wine.image || 'https://images.vivino.com/thumbs/0068ba2p910000_300x600.png'}" class="wine-thumb" alt="wine"></td>
            <td>
              <strong>${wine.name}</strong><br>
              <small style="color:#666;">${wine.winery || 'Unknown Winery'}</small>
            </td>
            <td><span style="background:#f0ece1; padding:3px 8px; border-radius:4px; font-size:0.8rem;">${wine.type || '-'}</span></td>
            <td>฿${(wine.price || 0).toLocaleString()}</td>
            <td>⭐ ${wine.rating || '5.0'}</td>
            <td>
              <button class="action-btn btn-edit-item" onclick="prepareEdit('${wine.id}')">✏️ Edit</button>
              <button class="action-btn btn-delete-item" onclick="deleteWine('${wine.id}')">🗑️ Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        // หากเป็นการโหลดเข้าหน้าเว็บจากลิงก์ที่มี ?id=...
        if (currentEditingId) {
          prepareEdit(currentEditingId);
        }

      } catch (err) {
        console.error('Error loading wines:', err);
        document.getElementById('wineTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Failed to load data.</td></tr>';
      }
    }

    // 2. ดึงข้อมูลรายการที่เลือกไปวางบนฟอร์มเพื่อแก้ไข (Update Prep)
    function prepareEdit(id) {
      const wine = allWinesData.find(w => w.id == id);
      if (!wine) return;

      currentEditingId = id;
      document.getElementById('formTitle').innerText = '✏️ Edit Wine Collection';
      document.getElementById('submitBtn').innerText = 'Update Wine';
      document.getElementById('cancelBtn').style.display = 'block';

      document.getElementById('winery').value = wine.winery || '';
      document.getElementById('name').value = wine.name || '';
      document.getElementById('type').value = wine.type || 'Red';
      document.getElementById('region').value = `${wine.region || ''}${wine.country ? ', ' + wine.country : ''}`;
      document.getElementById('price').value = wine.price || 0;
      document.getElementById('rating').value = wine.rating || 5.0;
      document.getElementById('image').value = wine.image || '';

      // เลื่อนหน้าจอขึ้นไปที่ฟอร์มด้านบน
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 3. บันทึกข้อมูลไวน์ (Create / Update)
    async function submitWine(e) {
      e.preventDefault();

      const regionInput = document.getElementById('region').value;
      let region = regionInput;
      let country = '';

      if (regionInput.includes(',')) {
        const parts = regionInput.split(',');
        region = parts[0].trim();
        country = parts[1].trim();
      } else {
        country = regionInput.trim();
      }

      const data = {
        winery: document.getElementById('winery').value.trim(),
        name: document.getElementById('name').value.trim(),
        type: document.getElementById('type').value,
        region: region,
        country: country || 'France',
        price: parseFloat(document.getElementById('price').value),
        rating: parseFloat(document.getElementById('rating').value) || 4.5,
        ratings_count: Math.floor(Math.random() * 500) + 50,
        image: document.getElementById('image').value.trim() || 'https://images.vivino.com/thumbs/0068ba2p910000_300x600.png'
      };

      const method = currentEditingId ? 'PUT' : 'POST';
      const url = currentEditingId ? `/api/wines/${currentEditingId}` : '/api/wines';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert(currentEditingId ? 'Wine updated successfully!' : 'Wine added successfully!');
          resetForm();
          loadWines(); // โหลดข้อมูลในตารางใหม่
        } else {
          alert('Failed to save wine data.');
        }
      } catch (err) {
        console.error(err);
        alert('An error occurred.');
      }
    }

    // 4. ลบข้อมูลไวน์ (Delete)
    async function deleteWine(id) {
      if (!confirm('Are you sure you want to delete this wine?')) return;

      try {
        const res = await fetch(`/api/wines/${id}`, {
          method: 'DELETE'
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alert('Wine deleted successfully!');
          if (currentEditingId === id) resetForm();
          loadWines(); // โหลดข้อมูลในตารางใหม่
        } else {
          alert('Failed to delete wine: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        console.error('Error deleting wine:', err);
        alert('An error occurred while deleting.');
      }
    }

    // 5. ล้างฟอร์มกลับสู่สภาวะเพิ่มข้อมูลใหม่
    function resetForm() {
      currentEditingId = null;
      document.getElementById('addWineForm').reset();
      document.getElementById('formTitle').innerText = '🍷 Wine Collection';
      document.getElementById('submitBtn').innerText = 'Add Wine to Cellar';
      document.getElementById('cancelBtn').style.display = 'none';

      // ลบ Query Parameter จาก URL ถ้ามี
      if (window.history.pushState) {
        window.history.pushState({}, document.title, window.location.pathname);
      }
    }
  </script>

</body>

</html>
